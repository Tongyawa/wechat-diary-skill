# Wechat-Diary configuration example.
# Copy to `config.toml` (which is git-ignored) and fill in your own values.

[user]
# Conversations treated as "self-collected" inbox; messages here can carry
# `D：` prefix items to be promoted into DoneList, etc.
self_wxids = ["filehelper"]               # filehelper = 文件传输助手; add your own wxid here too

# Legacy GUI backend only: contacts whose voice messages get WeFlow's built-in
# batch transcribe pass. The HTTP API backend transcribes inline via [asr].
voice_transcribe_usernames = []

[paths]
raw = "WeFlow-raw-exports"
processed = "WeFlow-processed-exports"
# Long-term library. Each daily run first merges the previous raw + processed
# into `archived/raw/<会话>/` and `archived/processed/<会话>/<day>.md` (same
# relative path: the newer export wins, so repeated runs deduplicate), then
# clears the live roots. Backfill ingestion uses scripts/archive_exports.py.
archived = "WeFlow-archived-exports"
insights = "WeFlow-insights"

[export_backend]
# "weflow_api" = WeFlow 5.x local HTTP API (default)
# "weflow" = legacy GUI automation for WeFlow <=4.x
# "manual" = process canonical raw already placed in [paths].raw
backend = "weflow_api"

[export_backend.weflow_api]
base_url = "http://127.0.0.1:5031"
# Keep one fixed non-empty token in the git-ignored config.toml. Token changes
# take effect only after restarting WeFlow's API service.
access_token = ""
media_localize = true
message_format = "json"
request_timeout_sec = 120                # media localization may take tens of seconds

[export_backend.weflow]
# Legacy WeFlow <=4.x GUI-automation settings.
#   "cdp"      - Chromium DevTools Protocol (--remote-debugging-port), current first path
#   "uia"      - pywinauto + Windows UI Automation, kept as fallback path
#   "template" - multi-scale image template matching + OCR, last-resort fallback
driver = "cdp"
weflow_exe = "C:/Path/To/WeFlow.exe"
launch_timeout_sec = 90
poll_export_interval_sec = 60             # task-center polling cadence (WeFlow exports take minutes)
cdp_busy_timeout_sec = 300                # tolerate an alive-but-unresponsive WeFlow: retry :9222 at connect AND wait out a transient renderer freeze per evaluate (busy != dead)

# Window normalization applied every session entry, regardless of driver.
window_geometry = { width = 1280, height = 900 }

# Flags appended to the WeFlow exe launch (driver-dependent; harmless if unsupported).
electron_accessibility_flag = "--force-renderer-accessibility"
electron_cdp_port = 9222                  # only used when driver = "cdp"

[export_backend.weflow.template_fallback]
# Only consulted when driver = "template".
zoom_reset_shortcut = "ctrl+0"            # pressed once on entry; we never change zoom mid-session
multi_scale = [0.85, 0.9, 0.95, 1.0, 1.05]
retry = 3

[asr]
# "" disables ASR with an explicit transcription-failure placeholder.
# "whisper" is reserved and intentionally not implemented in this phase.
engine = ""
model = "iic/SenseVoiceSmall"
language = "zh"
device = "cpu"
emit_emotion = true
# Optional install: python -m pip install -r requirements-asr.txt

[preprocessing]
skip_emoji_dir = true                     # ignore media/emojis/ entirely (no OCR)
voice_fail_log_only = true                # do not abort on "转文字失败"; just warn
time_compress_interval_sec = 120          # merge adjacent text messages from the same sender
image_ocr_enabled = true
image_ocr_min_confidence = 0.55
# Max characters of OCR text inlined into the processed markdown body. Long
# screenshots (e.g. full UI captures) otherwise dominate the chat flow.
# 0 disables truncation. The raw OCR lines are still preserved on the message.
image_ocr_max_inline_chars = 80
# Install OCR dependency with: python -m pip install -r requirements.txt

[preprocessing.group_context_window]
# For group chats: keep messages near anchors. Anchors are the user's own
# messages, messages quoting the user, messages quoted by the user, and optional
# literal alias/nickname hits from `anchor_keywords`.
# Window = K-before + K-after messages, plus a time bound. Overlapping windows merge.
enabled = true                            # false keeps the complete group-chat message stream
messages_before = 3
messages_after = 5
time_window_minutes = 15                  # extra time-based bound; whichever is wider wins
anchor_keywords = []                      # e.g. your nickname variants; keep public example empty

[agent]
# Reserved for optional agent-driven second-stage processing. No bundled script
# currently reads this section; run daily export first, then invoke the needed
# skills from the same workspace.
cli = "claude"
model = "claude-opus-4.6"
extra_args = []                           # e.g. ["--permission-mode", "acceptEdits"]

[skills]
daily = ["wechat-diary-skill"]

[daily_export]
# Contacts to export as an additional sidecar stream. Use wxid when possible;
# display names also work for WeFlow search, but wxid is more stable.
target_usernames = []

# Contacts used only for exporting your own Moments into the public diary
# material stream. Do not put filehelper here; use your own wxid or a WeFlow
# searchable display name.
# Deliberately left commented out: a missing key means "never configured", so
# the first interactive run asks once and non-interactive runs warn loudly.
# An explicit [] means "deliberately disabled" and silences the prompt/warning.
# self_moments_usernames = ["wxid_yourself"]

# Sidecar markdown lands in:
#   WeFlow-processed-exports/<target_processed_subroot>/chats/<yyyy-mm-dd>.md
#   WeFlow-processed-exports/<target_processed_subroot>/moments/<yyyy-mm-dd>.md
target_processed_subroot = "_targets"

# Optional local script called after raw exports are stable and before processed
# markdown is rendered. Keep empty for the default setup. A local extension
# can point this at a script that repairs failed voice transcripts in raw JSON.
voice_fallback_script = ""

# Double-click daily export defaults to archive so manual runs do not silently
# delete yesterday's raw/processed workspace.
cleanup_mode = "archive"

# Legacy GUI backend only. The API backend never stops a user-owned WeFlow.
restart_weflow = true
